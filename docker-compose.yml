# Base de datos MySQL para desarrollo local del CIPSE XV.
# El esquema de db/sql/ se inicializa automáticamente al crear el volumen.
# El host 3307 está mapeado porque el equipo mantiene un mysqld local en 3306.
services:
  db:
    image: mysql:8.4
    container_name: cipse-db
    environment:
      MYSQL_DATABASE: cipse
      MYSQL_USER: cipse
      MYSQL_PASSWORD: cipse
      MYSQL_ROOT_PASSWORD: cipse_root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-pcipse_root"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  mysql_data:
