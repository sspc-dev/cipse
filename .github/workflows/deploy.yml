# CIPSE XV — pipeline de despliegue auto-hospedado (blue-green).
#
# El pipeline corre COMPLETO en el mismo servidor donde sirve el app:
# un Actions runner auto-hospedado (self-hosted) construye la imagen con
# docker build y despliega el stack blue-green. Sin registry, sin SSH y sin
# secrets: la imagen cipse:sha-<commit> vive en el almacén local de Docker
# del servidor.
#
# Flujo por release:
#   1. checkout:     el runner trae el código nuevo a SU área de trabajo
#                    (actions/checkout la limpia con git clean: NUNCA usar
#                    esa ruta como raíz de despliegue).
#   2. build:        docker build -t cipse:sha-<commit> -t cipse:latest .
#                    Dentro de la imagen corre la puerta de calidad
#                    (pnpm lint) y next build; no se necesita node/pnpm
#                    en el host.
#   3. sync:         rsync local de deploy/ y db/ al directorio estable
#                    DEPLOY_PATH (default /opt/cipse). Se excluyen
#                    deploy/dynamic/app-routing.yml y deploy/state.env:
#                    produce deploy.sh, no el repo; el .env del servidor
#                    tampoco se toca.
#   4. preflight:    bash deploy/preflight.sh --fix (valida rutas de
#                    certificados/PEM, router, app-routing.yml).
#   5. release:      bash deploy/deploy.sh cipse:sha-<commit>
#                    Blue-green: recreate del color inactivo, healthcheck,
#                    migraciones idempotentes, conmutación Traefik
#                    (provider file, hot reload), verificación y conservar
#                    el color anterior parado para rollback.
#
# Rollback manual: Run workflow → action = rollback (no reconstruye imagen;
# regresa al colo PREVIOUS cuyo tag local conserva el servidor).
#
# Concurrency sin cancelación: un release a mitad de migración no debe
# interrumpirse, así que los envíos se encolan. Environment "production".
#
# Requisitos del servidor (una vez, manual):
#   - Actions runner auto-hospedado registrado como servicio (usuario con
#     permiso del docker.sock) y git, rsync + docker compose v2 en su PATH.
#   - DEPLOY_PATH con .env de producción (copia de deploy/env.example), que
#     el compose referencia vía env_file y este pipeline NO sincroniza.
#   - Certificado y llave TLS + pem de OCI en /etc/ssl/certs (deploy/env.example).
#   - Primer arranque: docker compose --env-file .env -f deploy/docker-compose.yml \
#       -f deploy/docker-compose.tls.yml up -d
#
# Secret/vars requeridas: ninguna obligatoria. Opcional:
#   vars.DEPLOY_PATH   ruta estable del despliegue (default /opt/cipse)
#
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "Desplegar la rama actual (deploy) o revertir al colo anterior (rollback)"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback

concurrency:
  group: deploy
  # No cancelamos el release en curso: dejarlo terminar evita quedarse
  # dentro de una migración o una conmutación de Traefik.
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/cipse' }}

jobs:
  deploy:
    environment: production
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: construir la imagen localmente
        env:
          SHA: ${{ github.sha }}
        run: |
          docker build -t "cipse:sha-$SHA" -t cipse:latest .

      - name: sincronizar deploy/ y db/ al directorio estable
        run: |
          # El app-routing.yml y el estado del servidor NUNCA se pisan:
          # son producto de deploy.sh, no del repo. Solo si NO existe aún
          # (primer despliegue) se siembra el valor por defecto del repo;
          # deploy.sh lo reescribe según el estado en su paso 0.
          mkdir -p "$DEPLOY_PATH/deploy" "$DEPLOY_PATH/db"
          rsync -a --delete \
            --exclude 'dynamic/app-routing.yml' \
            --exclude 'state.env' \
            deploy/ "$DEPLOY_PATH/deploy/"
          rsync -a --delete \
            db/ "$DEPLOY_PATH/db/"
          [[ -f "$DEPLOY_PATH/deploy/dynamic/app-routing.yml" ]] || \
            rsync -a deploy/dynamic/app-routing.yml "$DEPLOY_PATH/deploy/dynamic/"

      - name: preflight
        run: |
          cd "$DEPLOY_PATH"
          bash deploy/preflight.sh --fix

      - name: despliegue blue-green
        env:
          SHA: ${{ github.sha }}
        run: |
          action="${{ inputs.action || 'deploy' }}"
          cd "$DEPLOY_PATH"
          if [[ "$action" == "rollback" ]]; then
            bash deploy/deploy.sh --rollback
          else
            bash deploy/deploy.sh "cipse:sha-$SHA"
          fi
