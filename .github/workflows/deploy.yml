name: deploy
on:
  push:
    branches:
      - main
jobs:
  ci:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: pnpm/setup@v1

        with:
          version: 10
          runtime: node@22
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Checkout code
        run: pnppm lint

      - name: Build to production
        run: pnpm build

  cd:
    runs-on: self-hosted
    needs: ci
    steps:
      - name: Build Docker image
        run: docker compose --env-file .env -f deploy/docker-compose.yml -f deploy/docker-compose.tls.yml up --build
