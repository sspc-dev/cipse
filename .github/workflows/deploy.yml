name: deploy
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build to production
        run: pnpm build

  cd:
    runs-on: self-hosted
    needs: ci
    steps:
      - name: Build Docker image
        run: docker build -t cipse:sha-${GITHUB_SHA::7} .
      - name: Deploy (blue-green)
        run: bash deploy/deploy.sh cipse:sha-${GITHUB_SHA::7}
