http:
  routers:
    cipse-http:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - web
      priority: 1
      service: cipse-app

    cipse-https:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - websecure
      priority: 1
      service: cipse-app
      tls: true

  services:
    cipse-app:
      loadBalancer:
        servers:
          - url: "http://app-a:3000"
