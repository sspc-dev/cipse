# CIPSE XV — overlay TLS para el stack de producción.
#
# Archivo APARTE de deploy/docker-compose.yml: se aplica encima con una
# segunda bandera -f. Habilita el entrypoint websecure (:443), monta la
# configuración dinámica (deploy/dynamic.yml) y define las rutas del host
# del certificado y la llave privados de xv-cipse.sspc.gob.mx.
#
# Rutas del host (valores por defecto, sobreescribibles con variables):
#   TLS_CERT_HOST_PATH  =/etc/ssl/certs/fullchain.pem
#                       →  /run/certs/cipse/cert.pem   (dentro de traefik)
#   TLS_KEY_HOST_PATH   =/etc/ssl/certs/xv-cipse.sspc.gob.mx.key
#                       →  /run/certs/cipse/key.pem    (dentro de traefik)
#
# No hace falta definir las variables: el overlay lee por defecto los
# archivos instalados en /etc/ssl/certs. Solo si el certificado o la llave
# viven en otra ruta (p. ej. renovación con otro nombre) se sobreescriben
# en el .env de la raíz. fullchain.pem debe incluir la hoja y la cadena
# intermedia. Permisos: el contenedor de Traefik corre como root, así que
# una llave con 600 y dueño distinto al del contenedor se lee sin problema.
#
# Uso (desde la raíz del repo):
#   bash deploy/preflight.sh --fix    # valida rutas/archivos y router único
#   bash deploy/deploy.sh <imagen>    # despliegue automatizado (pipeline)
#
# Si una de las rutas apunta a un directorio, Traefik falla con
# "read /run/certs/cipse/cert.pem: is a directory": Docker crea un
# directorio vacío cuando el origen del bind mount no existe. El preflight
# lo detecta y --fix lo elimina.
#
# Sin TLS (solo el compose base) el acceso continúa por HTTP :80; con el
# overlay todo HTTP redirige permanente a HTTPS (deploy/dynamic/tls.yml).
#
# Portadas de puertos son independientes del compose base: este archivo
# añade 443 pero respeta TRAEFIK_HTTP_PORT (p. ej. si el host ya ocupa :80).

services:
  traefik:
    restart: unless-stopped
    # El command de un overlay REEMPLAZA por completo el del base: hay que
    # redeclarar todas las opciones y añadir websecure. El provider file
    # (deploy/dynamic/) ya se declara en el base.
    command:
      - --entryPoints.web.address=:80
      - --entryPoints.websecure.address=:443
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=cipse-prod_internal
      # Configuración dinámica: directorio con tls.yml (certificados y
      # redirect) y app-routing.yml (colo activo del app).
      - --providers.file.directory=/etc/traefik/dynamic
      - --api=false
      - --ping=true
    ports:
      # Puerto HTTP del base se conserva; 443 es el nuevo punto de entrada.
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    volumes:
      # Heredados del base: socket docker (read-only), datos de Traefik y
      # configs dinámicas (deploy/dynamic/).
      # Rutas del certificado y de la llave en el host → dentro de Traefik.
      # Por defecto se leen de /etc/ssl/certs; TLS_*_HOST_PATH permite
      # sobreescribir la ruta sin editar este archivo.
      # create_host_path=false: si el archivo no existe en el host, el
      # contenedor falla al crearse en lugar de montar un directorio vacío.
      - type: bind
        source: ${TLS_CERT_HOST_PATH:-/etc/ssl/certs/fullchain.pem}
        target: /run/certs/cipse/cert.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TLS_KEY_HOST_PATH:-/etc/ssl/certs/xv-cipse.sspc.gob.mx.key}
        target: /run/certs/cipse/key.pem
        read_only: true
        bind:
          create_host_path: false

